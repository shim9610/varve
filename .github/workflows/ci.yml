name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # CI-03: every third-party ACTION and every installed cargo TOOL is pinned to
  # an immutable identity. Action refs are commit ids (a tag can be moved; a
  # commit id cannot), with the human readable release next to them, and
  # installed cargo tools carry an exact `--version`. Bump these deliberately,
  # in a commit that says so.
  #
  # This is deliberately NOT a claim that a CI run is reproducible. Two inputs
  # are rolling by design and are not pinned here:
  #
  #   * the runner images `ubuntu-latest` and `windows-latest`, which GitHub
  #     rebuilds continuously (system libraries, linkers, preinstalled tools);
  #   * the `stable` toolchain requested by every job except `msrv`, which
  #     advances every six weeks.
  #
  # Pinning those would defeat what they exist to catch — a break on a newer
  # compiler or image — so the `msrv (1.95.0)` job is the only job in this
  # workflow that evaluates a fixed toolchain, and no job evaluates a fixed
  # image. A red run on an unchanged commit is therefore an expected outcome,
  # not evidence of a workflow defect.
  #
  #   actions/checkout                v4.2.2
  #   Swatinem/rust-cache             v2.9.1
  #   EmbarkStudios/cargo-deny-action v2.1.1
  #   dtolnay/rust-toolchain          master (the action pins no toolchain of
  #                                   its own; the toolchain is the `toolchain`
  #                                   input below)
  CARGO_AUDIT_VERSION: 0.22.2
  # CI-02: the floor the packages declare (`rust-version` in the workspace
  # Cargo.toml). Kept here so the MSRV job and the manifests are edited
  # together.
  MSRV: 1.95.0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Lints a fixed LIST of feature configurations, not every combinatorial
  # subset: no-default, default, each optional feature on its own, and
  # all-features. The facade exposes 6 optional features (`integrity`, `mmap`,
  # `zero-copy`, `compression-zstd`, `high-cardinality-dev`,
  # `scalable-fault-injection`), so the full power set is 64 configurations;
  # this job runs 9 of them on each of two operating systems.
  # The singletons catch a feature that does not compile alone, and
  # `--all-features` catches a conflict between any two — the gap is a defect
  # that needs a specific pair or triple of features and is invisible under
  # both, which no job here claims to cover. `cargo clippy` uses the workspace
  # rustc wrapper, so `-p varve` also lints `varve-core` and `varve-macros`
  # under the exact feature set the umbrella crate enables.
  feature-matrix:
    name: clippy (${{ matrix.features.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        features:
          - { name: no-default, flags: "-p varve --no-default-features" }
          - { name: default, flags: "-p varve" }
          - {
              name: integrity,
              flags: "-p varve --no-default-features --features integrity",
            }
          - {
              name: mmap,
              flags: "-p varve --no-default-features --features mmap",
            }
          - {
              name: zero-copy,
              flags: "-p varve --no-default-features --features zero-copy",
            }
          - {
              name: compression-zstd,
              flags: "-p varve --no-default-features --features compression-zstd",
            }
          - {
              name: high-cardinality-dev,
              flags: "-p varve --no-default-features --features high-cardinality-dev",
            }
          - {
              name: scalable-fault-injection,
              flags: "-p varve --no-default-features --features scalable-fault-injection",
            }
          - { name: all-features, flags: "--workspace --all-features" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.features.name }}
      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.features.flags }} -- -D warnings

  # Full test runs on both platforms stay limited to the default and all-feature
  # sets; the feature matrix above type-checks and lints every other
  # combination, and `feature-tests` below runs the configurations that have
  # behaviour no other job can reach. Tests go through the hygiene runner so
  # leaked temp artifacts fail CI (docs/test-artifact-hygiene.md).
  test:
    name: test (${{ matrix.features.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        features:
          - { name: default, flags: "--workspace" }
          - { name: all-features, flags: "--workspace --all-features" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: test-${{ matrix.features.name }}
      - name: Test
        run: cargo run --locked -p varve-test-runner -- test --locked ${{ matrix.features.flags }}

  # CI-01: the two configurations below own tests that run in NO other job.
  # `compression.rs` gates behaviour on `compression-zstd` *without* `integrity`
  # and on `integrity` *without* `compression-zstd`; the default job has
  # neither feature and the all-features job has both, so those assertions were
  # compiled out of every test run and only ever type-checked by Clippy.
  #
  # Deliberately scoped: single OS, and only `--test compression`, which is the
  # only test binary in the workspace that contains `not(feature = ...)` cases
  # (`compression.rs`). Adding the full feature matrix — or the whole package
  # suite under each singleton — would multiply CI time for combinations the two
  # jobs above already cover, without reaching any additional assertion.
  feature-tests:
    name: test (${{ matrix.features.name }}, ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - {
              name: compression-without-integrity,
              flags: "-p varve --no-default-features --features compression-zstd --test compression",
            }
          - {
              name: integrity-without-compression,
              flags: "-p varve --no-default-features --features integrity --test compression",
            }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: test-${{ matrix.features.name }}
      - name: Test
        run: cargo run --locked -p varve-test-runner -- test --locked ${{ matrix.features.flags }}

  # CI-02: the packages declare `rust-version = 1.95`. Every other job installs
  # moving stable, so once stable advances past the floor nothing proves the
  # floor still builds. This job pins the declared MSRV exactly and both checks
  # and tests against it, which is what makes the manifest claim true rather
  # than aspirational.
  msrv:
    # Literal, not `${{ env.MSRV }}`: the `env` context is not available in
    # `jobs.<id>.name`. The value is asserted against the manifests below.
    name: msrv (1.95.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: msrv
      - name: Declared MSRV matches the toolchain under test
        run: |
          declared="$(cargo metadata --locked --no-deps --format-version 1 \
            | tr ',' '\n' | grep -o '"rust_version":"[^"]*"' | head -n 1 \
            | cut -d'"' -f4)"
          echo "manifest rust-version: ${declared}"
          case "${MSRV}" in
            "${declared}"|"${declared}".*) ;;
            *)
              echo "::error::MSRV job pins ${MSRV} but the manifests declare ${declared}"
              exit 1
              ;;
          esac
      - name: cargo check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: cargo test
        run: cargo run --locked -p varve-test-runner -- test --locked --workspace --all-features

  # API2-05 regression guard: a downstream crate that renames the varve
  # dependency (`vv = { package = "varve", … }`) must compile and run with no
  # `extern crate` workaround. trybuild cannot express a renamed dependency
  # (it reuses the host crate's dependency graph), so this is a standalone
  # fixture crate outside the workspace; unit tests on the token-rewrite
  # helper demonstrably missed the `IDENT: ::varve::…` expansion shape that
  # only a real downstream build exercises.
  renamed-dependency:
    name: renamed-dependency fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: renamed-dependency
          workspaces: tools/rename-fixture
      - name: Build and run the renamed-dependency fixture
        working-directory: tools/rename-fixture
        run: cargo run --locked

  # API-03/API-04 regression guard, and the structural gate for the whole class:
  # a downstream crate that derives blocks over EVERY public codec and field
  # type the documentation tells users to use. Round 3 added a mandatory
  # non-zero `SCHEMA_ID` contract for field codecs and never gave the built-in
  # public types `ChunkedBytes` and `PackedBitmap` an identity, so the derive
  # macro began rejecting documented public API. No in-workspace test noticed,
  # because none of them derived a block over the public surface the way a
  # consumer does. This crate is outside the workspace for the same reason
  # `rename-fixture` is: it must resolve `varve` through its own manifest.
  public-api:
    name: public-api fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: public-api
          workspaces: tools/public-api-fixture
      - name: Build and run the public-API fixture
        working-directory: tools/public-api-fixture
        run: cargo run --locked

  # DOC-02 (F-12) release gate: docs.rs builds the published documentation with
  # warnings that nothing in this workflow previously evaluated — a broken
  # intra-doc link, an unresolved `[`Type`]`, or a private-item link renders as
  # plain text on the published page and no other job notices. `RUSTDOCFLAGS`
  # applies to the rustdoc invocation for every crate in the graph, so
  # `--workspace` covers all three published crates at once, and
  # `--document-private-items` is deliberately NOT used: the gate must evaluate
  # exactly the surface a user sees on docs.rs.
  #
  # F-06: `--all-features` matches docs.rs *because the three publishable
  # manifests say so*, not by coincidence. All three declare
  # `[package.metadata.docs.rs] all-features = true`; without that declaration
  # docs.rs would use its default selection, which for `default = []` is no
  # optional feature at all, and every feature-gated public item would be
  # absent from the published page while this job happily checked a surface no
  # user sees. If that metadata is ever removed, this job stops gating docs.rs.
  #
  # The second step gates the *other* surface a user can compile: the crates
  # with no optional feature enabled. It is not the docs.rs surface; it exists
  # so a link that only resolves when some feature is on cannot break the
  # minimal build.
  #
  # Rustdoc EXAMPLES are gated by the `test` jobs above, not here: the runner
  # forwards to plain `cargo test`, which compiles and runs doctests. That is
  # only meaningful because the two proc-macro entry-point examples are no
  # longer ```ignore — while they were, they compiled in no job at all and were
  # free to drift from the macros they document.
  rustdoc:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: rustdoc
      - name: cargo doc (docs.rs surface, all features)
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: cargo doc (minimal surface, no default features)
        run: cargo doc --locked --workspace --no-default-features --no-deps

  # Release gate: audit/deny failures block the merge.
  supply-chain:
    name: deny + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
          cargo audit

  # F-09 negative policy fixture. `deny.toml` enables `allow-wildcard-paths`,
  # which is a CATEGORY allowance, not an allowance for the single
  # `varve-macros` dev edge that motivated it. A passing `cargo deny check`
  # proves the accepted shape is accepted; it proves nothing about what is
  # still refused, so the two shapes the comment in `deny.toml` claims are
  # DENIED are asserted here by introducing each one and requiring the gate to
  # fail. Without this, silently widening the exception (or a cargo-deny
  # behaviour change) would look exactly like a green build.
  #
  # Each mutation runs on a fresh checkout, so nothing is restored and no
  # ordering between the two steps matters.
  dependency-policy-fixture:
    name: deny negative fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Introduce a registry wildcard in a published crate
        run: |
          set -euo pipefail
          sed -i 's|^proptest\.workspace = true$|proptest = "*"|' crates/varve/Cargo.toml
          grep -q 'proptest = "\*"' crates/varve/Cargo.toml
      - id: registry-wildcard
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans
      - name: A registry wildcard must be denied
        run: |
          test "${{ steps.registry-wildcard.outcome }}" = "failure" \
            || { echo "deny.toml accepted a registry wildcard"; exit 1; }
      - name: Restore, then introduce a non-dev path wildcard in a published crate
        run: |
          set -euo pipefail
          git checkout -- crates/varve/Cargo.toml
          sed -i 's|^varve-core = { path = "\.\./varve-core", version = "[^"]*" }$|varve-core = { path = "../varve-core" }|' crates/varve/Cargo.toml
          grep -q '^varve-core = { path = "\.\./varve-core" }$' crates/varve/Cargo.toml
      - id: path-wildcard
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans
      - name: A non-dev path wildcard in a published crate must be denied
        run: |
          test "${{ steps.path-wildcard.outcome }}" = "failure" \
            || { echo "deny.toml accepted a non-dev path wildcard from a published crate"; exit 1; }

  # REL-01 release gate: `fuzz/` is an independent workspace with its own
  # lockfile and its own license policy, so nothing in the root workspace jobs
  # resolves it. A stale `fuzz/Cargo.lock` was therefore invisible to CI.
  # Locked resolution fails the build instead of silently updating the
  # lockfile, and the final diff proves that no gate in this job rewrote it
  # (an unlocked cargo-deny metadata resolution is exactly how the staleness
  # was masked locally).
  fuzz-supply-chain:
    name: fuzz workspace (locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      # Before any caching or tooling step: `Swatinem/rust-cache` and
      # cargo-deny both run an unlocked `cargo metadata`, which would rewrite a
      # stale lockfile and mask the very defect this job exists to catch.
      - name: Locked resolution
        working-directory: fuzz
        run: cargo metadata --locked --format-version 1 > /dev/null
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: fuzz
          workspaces: fuzz
      - name: cargo check
        working-directory: fuzz
        run: cargo check --locked --all-targets
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
          cargo audit --file fuzz/Cargo.lock
      # cargo-deny resolves `fuzz/deny.toml` from the fuzz workspace root; that
      # policy allows NCSA for `libfuzzer-sys`, which the publishable
      # workspace's policy deliberately does not.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: fuzz/Cargo.toml
      - name: Fuzz lockfile was not rewritten
        run: git diff --exit-code -- fuzz/Cargo.lock

  # DOC-01 release gate: the published `.crate` files must carry the README and
  # the license texts, not just a license expression in metadata. `cargo package
  # --list` is the authority on what a consumer actually receives, so the lists
  # are printed here and the required files are asserted.
  #
  # Scope note (F-11): this job is about NAMES only. `--no-verify` means no
  # archive is created and nothing is compiled, so it cannot detect an archive
  # that does not build. `package-archives` below is the job that does that.
  package-contents:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: package-contents
      - name: Packaged file lists include README and licenses
        run: |
          set -euo pipefail
          for package in varve varve-core varve-macros; do
            echo "=== ${package} ==="
            listing="$(cargo package --locked --no-verify -p "${package}" --list)"
            echo "${listing}"
            for required in README.md LICENSE-MIT LICENSE-APACHE; do
              if ! grep -qx "${required}" <<<"${listing}"; then
                echo "::error::${package} package omits ${required}"
                exit 1
              fi
            done
          done

  # REL-02 (F-11) release gate: `package contents` above proves only what the
  # file LIST says. It runs with `--no-verify`, so no `.crate` archive is ever
  # created and nothing is ever built from one. Every other job in this workflow
  # builds the checkout by path. The bytes a crates.io user actually downloads
  # were therefore never compiled anywhere.
  #
  # This job closes that. It has two halves:
  #
  #   1. `cargo package --locked` WITHOUT `--no-verify` for all three crates.
  #      Cargo writes the real `.crate` archives and then compiles each one from
  #      a temporary registry, so an inter-crate version requirement that no
  #      published version can satisfy, a source file excluded from the archive,
  #      or a path-only dependency that survives into the published manifest
  #      fails here.
  #   2. A STAGED CONSUMER. Verification proves each archive builds; it does not
  #      prove a downstream crate can USE the published surface. So the archives
  #      are extracted and the public-API fixture's source is rebuilt against
  #      the extracted trees through `[patch.crates-io]` — a crate outside this
  #      repository, resolving `varve` by version, exercising every documented
  #      codec and field type, and running to completion. Deliberately not
  #      `--locked`: a real consumer resolves its own lockfile.
  #
  # The extracted `varve` requires `varve-core`/`varve-macros` by VERSION, so
  # all three patch entries are required and all three are exercised.
  package-archives:
    name: package archives + staged consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: package-archives
      - name: Build and verify the .crate archives
        run: |
          set -euo pipefail
          cargo package --locked -p varve-core -p varve-macros -p varve
      - name: Stage a consumer against the packaged artifacts
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | tr '{,' '\n\n' | grep -o '"version":"[^"]*"' | head -n 1 \
            | cut -d'"' -f4)"
          echo "packaged version: ${version}"

          staged="${RUNNER_TEMP}/staged"
          consumer="${RUNNER_TEMP}/staged-consumer"
          mkdir -p "${staged}" "${consumer}/src"
          for package in varve-core varve-macros varve; do
            archive="target/package/${package}-${version}.crate"
            test -f "${archive}" || { echo "::error::missing ${archive}"; exit 1; }
            tar -xzf "${archive}" -C "${staged}"
          done

          # Same source as the `public-api fixture` job, different resolution:
          # that job builds the checkout by path, this one builds the archives.
          cp tools/public-api-fixture/src/main.rs "${consumer}/src/main.rs"
          cat > "${consumer}/Cargo.toml" <<EOF
          [package]
          name = "staged-consumer"
          version = "0.0.0"
          edition = "2024"
          publish = false

          [dependencies]
          varve = { version = "${version}", features = ["compression-zstd", "integrity"] }

          [patch.crates-io]
          varve = { path = "${staged}/varve-${version}" }
          varve-core = { path = "${staged}/varve-core-${version}" }
          varve-macros = { path = "${staged}/varve-macros-${version}" }

          [workspace]
          EOF
          cd "${consumer}"
          cargo run

  # Build the committed tree exactly as a source package consumer sees it:
  # `git archive` contains only tracked files, so a workspace member or
  # fixture that exists locally but was never committed fails here
  # (REL-01 regression guard).
  clean-archive:
    name: clean source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: Unpack tracked files only
        run: git archive --format=tar --prefix=varve-archive/ HEAD | tar -x -C "$RUNNER_TEMP"
      - name: cargo metadata
        working-directory: ${{ runner.temp }}/varve-archive
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: cargo check
        working-directory: ${{ runner.temp }}/varve-archive
        run: cargo check --workspace --all-targets --all-features --locked
      # The fuzz workspace is not a root workspace member, so the two steps
      # above never touch it. Its tracked-file completeness and lockfile
      # freshness need the same clean-archive treatment (REL-01).
      - name: cargo metadata (fuzz workspace)
        working-directory: ${{ runner.temp }}/varve-archive/fuzz
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: cargo check (fuzz workspace)
        working-directory: ${{ runner.temp }}/varve-archive/fuzz
        run: cargo check --locked --all-targets
      # The two out-of-workspace fixtures are tracked files too, and neither of
      # the checks above resolves them. A fixture whose sources or lockfile were
      # never committed must fail here, not in its own job on the next run.
      - name: cargo metadata (rename fixture)
        working-directory: ${{ runner.temp }}/varve-archive/tools/rename-fixture
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: cargo metadata (public-api fixture)
        working-directory: ${{ runner.temp }}/varve-archive/tools/public-api-fixture
        run: cargo metadata --locked --format-version 1 > /dev/null
