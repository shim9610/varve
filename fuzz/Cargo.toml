[package]
name = "varve-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"

[dependencies.varve]
path = "../crates/varve"
version = "0.4.0"
features = ["integrity", "mmap", "zero-copy", "compression-zstd", "high-cardinality-dev"]

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
name = "native_arbitrary"
path = "fuzz_targets/native_arbitrary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_arbitrary"
path = "fuzz_targets/codec_arbitrary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "layout_arbitrary"
path = "fuzz_targets/layout_arbitrary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "matrix_arbitrary"
path = "fuzz_targets/matrix_arbitrary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sidecar_arbitrary"
path = "fuzz_targets/sidecar_arbitrary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sidecar_mutation"
path = "fuzz_targets/sidecar_mutation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sidecar_state_machine"
path = "fuzz_targets/sidecar_state_machine.rs"
test = false
doc = false
bench = false
