[graph]
all-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# F-05: `crates/varve-macros` dev-depends on the facade by path only, so its
# doctests compile against the code the macro generates. A path dependency
# carries no version requirement, which cargo-deny scores as a wildcard, so the
# release-gating root `cargo deny check` reported `bans FAILED` while packaging
# passed - cargo strips path-only DEV dependencies from the published manifest,
# so the edge never reaches crates.io.
#
# Adding an explicit `version` instead would be worse, not better: the
# dev-dependency then survives into the published manifest and
# `cargo package -p varve-macros` fails with "no matching package named `varve`
# found" for any version the facade has not already published. The cycle is
# only publishable while the edge stays path-only.
#
# F-09, invariant 4: this option is a CATEGORY allowance, not an allowance for
# that one edge, and the previous comment here described it too narrowly. The
# scope it actually has, re-derived against cargo-deny 0.19.9 by introducing
# each shape and observing the result:
#
#   * published crate (`varve`, `varve-core`, `varve-macros`), path
#     DEV-dependency, no version  -> ALLOWED. This is the edge above; cargo
#     strips it from the published manifest, so it cannot reach crates.io.
#   * published crate, path dependency that is NOT a dev-dependency
#     -> DENIED ("allow-wildcard-paths is enabled, but does not apply to
#     public crates as crates.io disallows path dependencies").
#   * private crate (`publish = false`, i.e. `tools/varve-test-runner` and any
#     future tool), path dependency of ANY kind including a normal one
#     -> ALLOWED. Nothing about this workspace's current graph relies on that,
#     but the option grants it, and this file should not pretend otherwise.
#   * any crate, registry dependency with a wildcard requirement -> DENIED,
#     dev-dependency or not.
#
# So the residual policy surface this buys is: unversioned path dependencies
# from crates that are never published. That is acceptable because such crates
# are built only from this repository, where the path is the source of truth
# and a version requirement would add nothing. It is NOT the same statement as
# "only the varve-macros dev edge is permitted".
#
# The `dependency-policy-fixture` job in `.github/workflows/ci.yml` asserts the
# two DENIED shapes above still fail, so this allowance cannot silently widen.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
