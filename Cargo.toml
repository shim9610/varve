[workspace]
members = [
    "crates/varve",
    "crates/varve-core",
    "crates/varve-macros",
    "tools/varve-test-runner",
]
resolver = "3"
exclude = ["vendor/redb"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shim9610/varve"
rust-version = "1.95"
version = "0.10.1"

[workspace.dependencies]
crc32fast = "1.5.2"
crossbeam-skiplist = "0.1.3"
crossbeam-queue = "0.3.14"
libc = "0.2.189"
memmap2 = "0.9.11"
proc-macro2 = "1.0.107"
proptest = "1.11.0"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full", "extra-traits"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
trybuild = "1.0.121"
zerocopy = "0.8.59"
zstd = "0.14.0"
