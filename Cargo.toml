[workspace]
members = [
    "crates/varve",
    "crates/varve-core",
    "crates/varve-macros",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shim9610/varve"
rust-version = "1.95"
version = "0.3.0"

[workspace.dependencies]
crc32fast = "1.5.0"
memmap2 = "0.9.11"
proc-macro2 = "1.0.106"
proptest = "1.11.0"
quote = "1.0.46"
syn = { version = "2.0.118", features = ["full", "extra-traits"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
trybuild = "1.0.117"
zerocopy = "0.8.54"
zstd = "0.13.3"
