[workspace]
members = [
    "crates/varve",
    "crates/varve-core",
    "crates/varve-macros",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shim9610/varve"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
crc32fast = "1.5.0"
memmap2 = "0.9.10"
proc-macro2 = "1.0.106"
proptest = "1.11.0"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
thiserror = "2.0.18"
trybuild = "1.0.116"
zerocopy = "=0.8.48"
zstd = "0.13.3"
