[package]
name = "varve-core"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Runtime, codecs, and storage primitives for Varve binary formats"
documentation = "https://docs.rs/varve-core"
# DOC-01: the published `.crate` file must carry the project README and both
# license texts, not just a license expression in metadata. `readme` may point
# outside the package directory (cargo copies the file in as `README.md`);
# `include`/`exclude` may not, so the two license texts are real files in this
# directory and are picked up by cargo's default file selection. Verify with
# `cargo package --locked --offline --no-verify -p varve-core --list`.
readme = "../../README.md"

# F-06: `default = []`, so without this docs.rs would build the published page
# with NO optional feature enabled and every feature-gated public item would be
# missing from it - while the CI `rustdoc` job claimed `--all-features` was
# "the docs.rs default for this project". The claim is now true because it is
# declared here rather than assumed. `--cfg docsrs` is not set and no
# `doc_cfg` attributes are used, so the pages carry no feature annotations;
# the feature list stays the crate-level documentation's job.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
integrity = ["dep:crc32fast"]
mmap = ["dep:memmap2"]
zero-copy = ["mmap", "dep:zerocopy"]
compression-zstd = ["dep:zstd"]
high-cardinality-dev = ["dep:crc32fast", "dep:redb"]
scalable-fault-injection = ["high-cardinality-dev"]

[dependencies]
crc32fast = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true
zerocopy = { workspace = true, optional = true, features = ["derive"] }
zstd = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
