[package]
name = "varve"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Format-first, append-friendly custom binary formats for Rust"
documentation = "https://docs.rs/varve"
# DOC-01: see the note in `crates/varve-core/Cargo.toml`. README is pulled in
# from the repository root; `LICENSE-MIT` and `LICENSE-APACHE` are files in this
# directory because `include` cannot reference paths outside the package.
readme = "../../README.md"
keywords = ["binary", "serialization", "storage", "format", "append"]
categories = ["encoding", "filesystem", "data-structures"]

# F-06: see the note in `crates/varve-core/Cargo.toml`. `default = []` means
# docs.rs would otherwise publish this facade with none of its six optional
# features, hiding every gated re-export.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
integrity = ["varve-core/integrity"]
mmap = ["varve-core/mmap"]
zero-copy = ["mmap", "varve-core/zero-copy"]
compression-zstd = ["varve-core/compression-zstd"]
high-cardinality-dev = [
    "varve-core/high-cardinality-dev",
    "varve-macros/high-cardinality-dev",
]
scalable-fault-injection = [
    "high-cardinality-dev",
    "varve-core/scalable-fault-injection",
]

[dependencies]
varve-core = { path = "../varve-core", version = "0.4.0" }
varve-macros = { path = "../varve-macros", version = "0.4.0" }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
trybuild.workspace = true
zerocopy = { workspace = true, features = ["derive"] }
