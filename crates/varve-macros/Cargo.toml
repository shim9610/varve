[package]
name = "varve-macros"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Procedural macros for declaring Varve binary formats and blocks"
documentation = "https://docs.rs/varve-macros"
# DOC-01: see the note in `crates/varve-core/Cargo.toml`. README is pulled in
# from the repository root; `LICENSE-MIT` and `LICENSE-APACHE` are files in this
# directory because `include` cannot reference paths outside the package.
readme = "../../README.md"

# F-06: see the note in `crates/varve-core/Cargo.toml`. This crate's only
# optional feature changes what the macros GENERATE rather than what they
# export, so the documented surface is the same either way; the setting is
# declared anyway so all three published crates state their docs.rs surface
# explicitly instead of two of them stating it and one inheriting a default.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
# The dev-dependency edge keeps the doctests consistent with the code this
# feature makes the macro GENERATE: with `high-cardinality-dev` on, every
# expanded format emits scalable stream/indexed APIs, which only exist in the
# facade when its matching feature is on too. Without this the `varve_format!`
# doctest fails under `-p varve-macros --all-features`. It adds nothing to a
# normal build — `varve` is a dev-dependency, so this cannot pull the facade
# into the published dependency graph.
high-cardinality-dev = ["varve/high-cardinality-dev"]

[lib]
proc-macro = true

[dev-dependencies]
# DOC-02 (F-12): the two rustdoc examples on `VarveBlock` and `varve_format!`
# were `ignore`d, so nothing compiled them and they were free to drift out of
# sync with the macros they document. Compiling them needs the facade, which
# depends on this crate — a dev-dependency cycle, which cargo supports. The
# dependency stays path-resolved on purpose: cargo strips path-only
# dev-dependencies from the published manifest, so this never becomes a real
# dependency of the `.crate` archive (verified by the `package-archives` CI job,
# which builds each archive with verification enabled).
#
# F-05: this must NOT be given an explicit `version`. Adding one keeps the
# dev-dependency in the published manifest and `cargo package -p varve-macros`
# then fails with "no matching package named `varve` found", because the facade
# version being released is not on crates.io yet. Path-only is what makes the
# cycle publishable. cargo-deny scores the missing version as a wildcard, so
# `deny.toml` carries a documented, narrow `allow-wildcard-paths` exception for
# exactly this shape.
varve = { path = "../varve" }

[dependencies]
proc-macro-crate = "3.4.0"
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
